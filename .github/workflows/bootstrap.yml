name: Bootstrap interaction-sdk

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/chunks/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify starter archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunks/*.part | base64 -d > /tmp/interaction-sdk.tar.gz
          echo '4fe32a09432e60a96dc0dd4b2ff8a27b0bfdbb3c3a5e928fc7caec1883ebbe83  /tmp/interaction-sdk.tar.gz' | sha256sum -c -

      - name: Expand starter repository
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/interaction-sdk.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit full starter workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'feat: bootstrap interaction sdk reference architecture'
          git push origin HEAD:main
